seed: 42
data:
  csv: data/metadata.csv
  images: data/images
  split: data/split.csv
  image_column: img_id
  patient_column: patient_id
  label_column: diagnostic
  holdout_fraction: 0.15
  validation_fraction: 0.15
  image_size: 224
labels: [ACK, BCC, MEL, NEV, SCC, SEK]
train:
  batch_size: 8
  num_workers: 0  # Windows-safe initial setting; increase after testing
  stage1_epochs: 5
  stage2_epochs: 20
  head_lr: 0.001
  finetune_lr: 0.00003
  weight_decay: 0.01
  patience: 6
  amp: true
  sampler: weighted  # weighted or random
  pretrained: true
model:
  name: shufflenet_v2_x1_0
outputs: outputs
